[pytest]
# Pins the rootdir to the repo. Without a config file here, pytest walks up
# looking for one and settles on the filesystem root - and when the repo sits
# under a mounted home directory that walk touches whatever else lives there.
# On the Windows box it hit a Bitwarden SSH agent socket at the drive root and
# died with `PermissionError: [WinError 31]` during collection, before a single
# test ran.
testpaths = tests
