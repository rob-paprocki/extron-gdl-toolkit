<!doctype html>

<x-import component-from-global-scope="ExtronAfterburn.Label" name="CallState" type="body" color="text-secondary" align="center" does="Shows the codec's call status." style="position: absolute; left: 0px; top: 130px; width: 916px; height: 40px">No call in progress</x-import>

<x-import component-from-global-scope="ExtronAfterburn.Button" name="Laptop" variant="source" icon="laptop" states='[{"name":"No Signal","look":"off","color":"text-secondary"},{"name":"Ready","look":"off"},{"name":"Live","look":"on","fill":"pressed"}]' press="Live" does="Routes the laptop input to the display. No Signal until a laptop is connected, Ready once one is, Live while it is on the display.">Laptop</x-import>

<x-import component-from-global-scope="ExtronAfterburn.Clock" name="Time" align="right" style="position: absolute; left: 569px; top: 696px; width: 330px; height: 40px"></x-import>
</x-import>
<x-import component-from-global-scope="ExtronAfterburn.Rail">

<x-import component-from-global-scope="ExtronAfterburn.Button" name="Mute" variant="icon" states='[{"name":"Unmuted","icon":"speaker-volume_3","look":"on"},{"name":"Muted","icon":"speaker-mute-1","look":"on"}]' does="Toggles program mute; Muted while muted."></x-import>
