<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Main SD</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/extronturbulence/components/bundle.css">
<script src="ds/extronturbulence/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="ExtronTurbulence.Page" name="Main SD" panels="TLP1035T TLP725T TLP525T TLP320M" theme="office" does="The working page: sources, display, volume, lighting and the microphone mute.">
  <x-import component-from-global-scope="ExtronTurbulence.Header">
    <x-import component-from-global-scope="ExtronTurbulence.Button" slot="source" id="201" name="Laptop" icon="input_laptop" states="Off, On" nav="Laptop" does="Routes the table laptop to the display; On while it is the source on the display.">Laptop</x-import>
    <x-import component-from-global-scope="ExtronTurbulence.Button" slot="source" id="202" name="ShareLink" icon="blank" states="Off, On" nav="ShareLink" does="Routes the wireless ShareLink share to the display; On while it is the source on the display.">ShareLink</x-import>
    <x-import component-from-global-scope="ExtronTurbulence.Button" slot="source" id="203" name="PC" icon="input_pc" states="Off, On" nav="PC" does="Routes the room PC to the display; On while it is the source on the display.">PC</x-import>
    <x-import component-from-global-scope="ExtronTurbulence.Button" slot="source" id="204" name="Doc Cam" icon="input_doc-cam" states="Off, On" nav="DocCam" does="Routes the document camera to the display; On while it is the source on the display.">Doc Cam</x-import>
    <x-import component-from-global-scope="ExtronTurbulence.Label" slot="end" id="110" name="Display Status" align="center" does="Shows the display's state: Display Off, Display Warming Up, Display On or Display Cooling Down." style="width: 300px; height: 60px">Display Off</x-import>
  </x-import>
  <x-import component-from-global-scope="ExtronTurbulence.LeftRail">
    <x-import component-from-global-scope="ExtronTurbulence.Section" title="Display">
      <x-import component-from-global-scope="ExtronTurbulence.Button" name="Display On" states='[{"name":"Off"},{"name":"Warming Up","look":"off","color":"accent"},{"name":"On"},{"name":"Cooling Down","look":"on","color":"alert"}]' does="Turns the display on; shows Warming Up while it starts, On when ready and Cooling Down while it shuts down.">On</x-import>
      <x-import component-from-global-scope="ExtronTurbulence.Button" name="Display Off" states="Off, On" does="Turns the display off; On while the display is off.">Off</x-import>
      <x-import component-from-global-scope="ExtronTurbulence.Button" name="Display Mute" states="Off, On" does="Mutes the display picture; On while muted.">Mute</x-import>
    </x-import>
    <x-import component-from-global-scope="ExtronTurbulence.Section">
      <x-import component-from-global-scope="ExtronTurbulence.Button" name="Lighting Control" nav="LightingControl" does="Opens the lighting presets.">Lighting Control</x-import>
      <x-import component-from-global-scope="ExtronTurbulence.Button" id="101" name="Mic Mute" states='[{"name":"Live","look":"off"},{"name":"Muted","look":"on","text":"Mics Muted"}]' does="Mutes and unmutes the room microphones; Muted, with its caption changed to Mics Muted, while they are muted.">Mic Mute</x-import>
    </x-import>
  </x-import>
  <x-import component-from-global-scope="ExtronTurbulence.RightRail"></x-import>
  <x-import component-from-global-scope="ExtronTurbulence.Footer" help="Help" power="PowerDown">
    <x-import component-from-global-scope="ExtronTurbulence.Button" slot="mode" variant="dock" name="Video Call" nav="Call" does="Shows the call page for Microsoft Teams.">Video Call</x-import>
  </x-import>
  <x-import component-from-global-scope="ExtronTurbulence.Center" group="Sources"></x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
