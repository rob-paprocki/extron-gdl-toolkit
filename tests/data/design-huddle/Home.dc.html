<!doctype html>

<x-import component-from-global-scope="ExtronAfterburn.Label" name="RoomName" type="title" style="position: absolute; left: 40px; top: 0px; width: 520px; height: 112px">Huddle Room</x-import>
<x-import component-from-global-scope="ExtronAfterburn.Label" name="CallState" type="subheading" color="text-secondary" align="right" does="Shows the codec's call status." style="position: absolute; left: 560px; top: 0px; width: 440px; height: 112px">No call in progress</x-import>
<x-import component-from-global-scope="ExtronAfterburn.Button" name="HelpBtn" nav="Help" style="position: absolute; left: 1040px; top: 24px; width: 200px; height: 64px">Help</x-import>

<div style="position: absolute; left: 72px; top: 636px; width: 696px; height: 72px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">

<x-import component-from-global-scope="ExtronAfterburn.Button" name="VolDown" variant="inverse" type="button-large" does="Volume down one step; repeats while held.">–</x-import>
<x-import component-from-global-scope="ExtronAfterburn.Button" name="VolUp" variant="inverse" type="button-large" does="Volume up one step; repeats while held.">+</x-import>

<x-import component-from-global-scope="ExtronAfterburn.Button" name="RoomOff" variant="inverse" nav="ConfirmRoomOff" style="position: absolute; left: 1060px; top: 740px; width: 180px; height: 56px">Room Off</x-import>
</x-import>
