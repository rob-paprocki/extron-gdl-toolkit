<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select a Source</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/extronafterburn/components/bundle.css">
<script src="ds/extronafterburn/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- Main Select Source: all five sources as tiles; the working page's Header holds only four tabs. -->
<x-import component-from-global-scope="ExtronAfterburn.Page" name="Select Source" role="select" panels="TLP1035T TLP725T TLP525T TLP320M" theme="blue-slate" does="Chooses a source before the working page shows it.">
  <x-import component-from-global-scope="ExtronAfterburn.Header">
    <x-import component-from-global-scope="ExtronAfterburn.Button" slot="source" name="PC Tile" id="111" icon="pc" nav="MainSD" does="Shows the working page with the instructor's PC controls in the Center.">PC</x-import>
    <x-import component-from-global-scope="ExtronAfterburn.Button" slot="source" name="Laptop Tile" id="112" icon="laptop" nav="MainSD" does="Shows the working page with the lectern laptop's controls in the Center.">Laptop</x-import>
    <x-import component-from-global-scope="ExtronAfterburn.Button" slot="source" name="ShareLink Tile" id="113" icon="streaming" nav="MainSD" does="Shows the working page with the ShareLink controls in the Center.">ShareLink</x-import>
    <x-import component-from-global-scope="ExtronAfterburn.Button" slot="source" name="Doc Cam Tile" id="114" icon="camera" nav="MainSD" does="Shows the working page with the document camera controls in the Center.">Doc Cam</x-import>
    <x-import component-from-global-scope="ExtronAfterburn.Button" slot="source" name="Blu-ray Tile" id="115" icon="tv" nav="MainSD" does="Shows the working page with the Blu-ray player's controls (BluRay popup) in the Center.">Blu-ray</x-import>
  </x-import>
  <x-import component-from-global-scope="ExtronAfterburn.LeftRail">
    <x-import component-from-global-scope="ExtronAfterburn.Section" title="Display">
      <x-import component-from-global-scope="ExtronAfterburn.Button" name="Front Power" id="201" display="Projector" states='[{"name":"Off"},{"name":"Warming Up","icon":"toggle-2","look":"on"},{"name":"On"},{"name":"Cooling Down","icon":"toggle-2","look":"off"}]' does="Turns the front projector on and off. The program sets Warming Up and Cooling Down while it changes, and On while it is on.">Front</x-import>
      <x-import component-from-global-scope="ExtronAfterburn.Button" name="Back Power" id="202" display="Monitor" states='[{"name":"Off"},{"name":"Warming Up","icon":"toggle-2","look":"on"},{"name":"On"},{"name":"Cooling Down","icon":"toggle-2","look":"off"}]' does="Turns the back confidence monitor on and off. The program sets Warming Up and Cooling Down while it changes, and On while it is on.">Back</x-import>
    </x-import>
    <x-import component-from-global-scope="ExtronAfterburn.Section" title="Settings">
      <x-import component-from-global-scope="ExtronAfterburn.Button" name="Screen" id="203" icon="screen" nav="Screen">Screen</x-import>
      <x-import component-from-global-scope="ExtronAfterburn.Button" name="Lighting" id="204" icon="lights" nav="Lighting">Lighting</x-import>
      <x-import component-from-global-scope="ExtronAfterburn.Button" name="Audio" id="205" icon="audio" nav="Audio" states='[{"name":"Mics Live"},{"name":"Mics Muted","look":"on"}]' does="Opens the audio settings; lit while the wireless mics are muted.">Audio</x-import>
      <x-import component-from-global-scope="ExtronAfterburn.Button" name="Recording" id="206" icon="record" nav="Recording" states='[{"name":"Idle"},{"name":"Recording","look":"on"}]' does="Opens the recording settings; lit, with the red record icon, while the room is recording.">Recording</x-import>
    </x-import>
  </x-import>
  <x-import component-from-global-scope="ExtronAfterburn.RightRail"></x-import>
  <x-import component-from-global-scope="ExtronAfterburn.Footer" help="Help" power="PowerDown">
    <x-import component-from-global-scope="ExtronAfterburn.Button" slot="mode" name="Video Conference" nav="Call" does="Shows the call page.">Video Conference</x-import>
  </x-import>
  <x-import component-from-global-scope="ExtronAfterburn.Center" group="Sources"></x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
