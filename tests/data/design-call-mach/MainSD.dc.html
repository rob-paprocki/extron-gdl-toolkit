<x-import component-from-global-scope="ExtronMach.Page" name="Main SD" panels="TLP1035T TLP725T TLP525T TLP320M" theme="lake" does="The working page.">
<x-import component-from-global-scope="ExtronMach.Header">
  <x-import component-from-global-scope="ExtronMach.Button" slot="source" id="101" name="Laptop" icon="laptop" nav="Laptop" states="Off, On" does="Routes the laptop to the display; On while it is shown.">Laptop</x-import>

    <x-import component-from-global-scope="ExtronMach.Button" name="Display Mute" states="Off, On" does="Blanks the display; On while blanked.">Mute</x-import>
  </x-import>
  <x-import component-from-global-scope="ExtronMach.Section" title="Settings">
    <x-import component-from-global-scope="ExtronMach.Button" name="Lighting" nav="Lighting" does="Opens the lighting.">Lighting</x-import>
  </x-import>
</x-import>
<x-import component-from-global-scope="ExtronMach.RightRail"></x-import>
<x-import component-from-global-scope="ExtronMach.Footer" help="Help" power="PowerDown">

</x-import>
<x-import component-from-global-scope="ExtronMach.Center" group="Sources"></x-import>
