<!doctype html>
<html lang="en">

<x-import component-from-global-scope="ExtronTurbulence.Page" name="Main SD" does="The working page: sources, displays, volume, lighting and recording." panels="TLP1035T TLP725T TLP525T TLP320M" theme="office">
  <x-import component-from-global-scope="ExtronTurbulence.Header">
    <x-import component-from-global-scope="ExtronTurbulence.Button" slot="source" id="111" name="PC" icon="input_pc" nav="PC" states="Off, On" does="Shows the PC and routes the instructor's PC to the projector; On while it is on the projector.">PC</x-import>
    <x-import component-from-global-scope="ExtronTurbulence.Button" slot="source" id="112" name="Laptop" icon="input_laptop" nav="Laptop" states="Off, On" does="Shows the laptop and routes the lectern laptop to the projector; On while it is on the projector.">Laptop</x-import>
    <x-import component-from-global-scope="ExtronTurbulence.Button" slot="source" id="113" name="ShareLink" icon="blank" nav="ShareLink" states="Off, On" does="Shows ShareLink and routes wireless sharing to the projector; On while it is on the projector.">ShareLink</x-import>
    <x-import component-from-global-scope="ExtronTurbulence.Button" slot="source" id="114" name="Doc Cam" icon="input_doc-cam" nav="DocCam" states="Off, On" does="Shows the document camera and routes it to the projector; On while it is on the projector.">Doc Cam</x-import>

    <x-import component-from-global-scope="ExtronTurbulence.Button" slot="end" id="123" variant="dock" name="Record" states='[{"name":"Off"},{"name":"Recording","text":"Recording","look":"on","color":"alert"}]' does="Starts recording the lecture; lit and reading Recording while the room records. Pressed while recording, the program shows the Stop Recording question.">Record</x-import>
  </x-import>
  <x-import component-from-global-scope="ExtronTurbulence.LeftRail">
    <x-import component-from-global-scope="ExtronTurbulence.Section" title="Display">
      <x-import component-from-global-scope="ExtronTurbulence.Button" name="Display On" states='[{"name":"Off"},{"name":"Warming Up","text":"Warming","look":"off","color":"accent"},{"name":"On","look":"on"}]' does="Turns on the projector and the confidence monitor; shows Warming while they warm up and On when both are on.">On</x-import>
      <x-import component-from-global-scope="ExtronTurbulence.Button" name="Display Off" states='[{"name":"Off"},{"name":"Cooling Down","text":"Cooling","look":"off","color":"accent"},{"name":"On","look":"on"}]' does="Turns off the projector and the confidence monitor; shows Cooling while they cool down and On when both are off.">Off</x-import>
    </x-import>
    <x-import component-from-global-scope="ExtronTurbulence.Section">
      <x-import component-from-global-scope="ExtronTurbulence.Button" id="121" variant="dock" name="Display Control" nav="DisplayControl">Display Control</x-import>
      <x-import component-from-global-scope="ExtronTurbulence.Button" id="122" variant="dock" name="Lighting Control" nav="LightingControl">Lighting Control</x-import>
    </x-import>
  </x-import>
  <x-import component-from-global-scope="ExtronTurbulence.RightRail">
    <x-import component-from-global-scope="ExtronTurbulence.Button" slot="audio" id="131" variant="dock" name="Audio Control" nav="AudioControl" states='[{"name":"Off"},{"name":"Mics Muted","text":"Mics Muted","look":"on","color":"lime"}]' does="Shows the audio window; lit and reading Mics Muted while the wireless microphones are muted.">Audio Control</x-import>

  <x-import component-from-global-scope="ExtronTurbulence.Footer" help="Help" power="PowerDown">
    <x-import component-from-global-scope="ExtronTurbulence.Button" slot="mode" name="Video Call" variant="dock" nav="Call" does="Shows the call page.">Video Call</x-import>
  </x-import>
  <x-import component-from-global-scope="ExtronTurbulence.Center" group="Sources"></x-import>
</x-import>
