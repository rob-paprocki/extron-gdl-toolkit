name: ci

# What CI can and cannot cover here:
#
#   CAN  - the layout maths, ID allocation and Extron's numeric design rules.
#          gdl/spec.py is stdlib-only at module level and tests/test_spec.py
#          needs no Pillow, so this runs on a bare runner.
#   CAN  - reading the authoring model out of the fixtures and the seeds
#          (gdl/project.py, gdl/nrbf.py, gdl/container.py are all stdlib).
#   CAN  - the render fidelity harness, where the client fixtures are - the
#          archive; the public copy holds them back, and the steps that read
#          them run only where they exist (if: hashFiles). gdl/fonts/ is
#          deliberately not in git, but every face the fixtures declare comes
#          back out of them with stdlib alone, so the runner reproduces
#          tests/baseline.json exactly. Where they are not, the faces come out
#          of seeds/Afterburn 1035.gdl.
#          Recover the faces FIRST: without them face() raises where no Arial
#          is installed, and where one is, score.py record refuses to score
#          over the stand-in (exit 2) - docs/history.md has the wrong number
#          it reported before it refused.
#   CAN  - the Claude Design translator's rules, run on the probe's output
#          (tests/test_design.py), and the design systems' grammar and what the
#          spec can build from them (tests/test_designsys.py). Both are stdlib,
#          so they run in `test`. The type probe's measuring half imports
#          Pillow, so it runs in `fidelity`, and so do test_states and
#          test_spec a second time: their artwork and preview tests need
#          Pillow and skip in `test`. test_palette, test_templates and
#          test_verify_seed run in `test` too; what they assert of the
#          seeds CI pulls runs, and what reads another seed or Extron's
#          template table skips (below).
#   CAN  - what the scripts that need GUI Designer promise their callers, as
#          text (tests/test_seed_script.py, test_panel_scripts.py,
#          test_gd_blocker.py), and the
#          corpus audit's verdicts on the facts it reduces a project to
#          (tests/test_audit_corpus.py); the audit itself reads the seeds and
#          Extron's templates.
#   CANNOT - anything that authors a .gdl. That needs 32-bit Windows PowerShell
#          and an installed GUI Designer.
#   CANNOT - anything that reads files a plain checkout lacks. Those tests skip
#          here, and only a provisioned machine running `python -m pytest`
#          exercises them:
#            - the seeds this file does not pull. Git LFS is not pulled by
#              actions/checkout, so each job pulls the seeds the suite reads:
#              all of Afterburn's, the 320, 525, 725 and 1035 of Mach, the 320,
#              525 and 1035 of Shockwave and Turbulence's 320 and 1035 - 190 MB of
#              the 570 the 41 seeds hold, enough that the region frame, the call
#              mode, the hubs and the 320 of each theme run here.
#              Turbulence's 525, 720, 725 and 1525 (37 to 67 MB each, 225 MB
#              together) and the Mach, Shockwave and
#              Turbulence 535, 720 and 1535 and ECP seeds are left out, and what
#              reads them skips. The cost is LFS bandwidth, which a private
#              repository's plan meters (1 GiB a month on the free one):
#              pulling every seed would spend it in two runs, so the objects are
#              cached (.git/lfs). One job, `lfs`, restores the cache or pulls and
#              saves it, and the jobs that read the seeds need it, so a miss is
#              fetched once, not once per job. The key hashes only the pointers of
#              the seeds pulled, so a change to a seed CI does not pull misses
#              nothing; and restore-keys lets a changed seed start from the last
#              cache, so only what is missing is fetched. Whatever the cache has
#              evicted (7 days unused) is pulled again, once. A pull request
#              restores only a cache saved on its base branch or its own, so the
#              first one after a seed change pays for it.
#            - Extron's templates and kit: vendor/ is not in git, and no GUI
#              Designer is installed. A seed carries only the images its own
#              pages use, so the tests that need the whole kit or the template
#              table skip rather than read a seed (the extraction tests, which
#              do read a seed's art, run). In test_design that is each test
#              marked needs_kit, or skip_without_kit, for the theme it lays
#              out: without the kit a theme's system draws no icons, so what
#              its template draws as kit art comes out as a caption at another
#              size (Mach's 100 px source tiles 101 wide) or as no image.
#            - test_design's Chrome tests, in the public copy: they need the
#              Design type's runtime ($GDL_DC_RUNTIME), which is Anthropic's and
#              excluded from the public copy (tools/public_sync.py). In the
#              archive archive/dc-runtime/ holds it; the `chrome` job, a job of
#              its own so the quick tests are not held up by it, exports the
#              runtime the repository pins and the runner's Chrome does the rest.
#              That job runs the file under pytest with -n 4, as it was timed
#              here: 78 tests in 37 minutes on a shared 8-core box, which gave the
#              four workers about one core between them (2271 s of CPU in 2229 s of
#              wall), so the bound is 90 minutes, a little over twice that.
#
# Every job has a timeout-minutes; a hung Chrome would otherwise hold a runner for
# GitHub's default six hours.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lfs:
    # The one job that spends LFS bandwidth: it restores the cache (the newest
    # one for another set of seeds, if this exact key misses), pulls what is
    # missing, and the cache is saved when it ends. See the header.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: restore the seeds' LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-seeds-v2-${{ hashFiles('seeds/Afterburn*.gdl', 'seeds/Mach 320.gdl', 'seeds/Mach 525.gdl', 'seeds/Mach 725.gdl', 'seeds/Mach 1035.gdl', 'seeds/Shockwave 320.gdl', 'seeds/Shockwave 525.gdl', 'seeds/Shockwave 1035.gdl', 'seeds/Turbulence 320.gdl', 'seeds/Turbulence 1035.gdl') }}
          restore-keys: |
            lfs-seeds-v2-

      - name: the seeds the suite reads (Git LFS, 190 MB of the 570)
        # Every Afterburn seed, the 320, 525, 725 and 1035 of Mach and the 320, 525
        # and 1035 of Shockwave, and Turbulence's 320 and 1035. See the header: what
        # is left out, and why.
        run: git lfs pull --include "seeds/Afterburn*.gdl,seeds/Mach 320.gdl,seeds/Mach 525.gdl,seeds/Mach 725.gdl,seeds/Mach 1035.gdl,seeds/Shockwave 320.gdl,seeds/Shockwave 525.gdl,seeds/Shockwave 1035.gdl,seeds/Turbulence 320.gdl,seeds/Turbulence 1035.gdl"

  test:
    needs: lfs
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: the seeds' LFS objects, from the `lfs` job's cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-seeds-v2-${{ hashFiles('seeds/Afterburn*.gdl', 'seeds/Mach 320.gdl', 'seeds/Mach 525.gdl', 'seeds/Mach 725.gdl', 'seeds/Mach 1035.gdl', 'seeds/Shockwave 320.gdl', 'seeds/Shockwave 525.gdl', 'seeds/Shockwave 1035.gdl', 'seeds/Turbulence 320.gdl', 'seeds/Turbulence 1035.gdl') }}
          fail-on-cache-miss: true

      - name: check out the seeds the suite reads from them
        # The objects are local, so this fetches nothing from GitHub.
        run: git lfs pull --include "seeds/Afterburn*.gdl,seeds/Mach 320.gdl,seeds/Mach 525.gdl,seeds/Mach 725.gdl,seeds/Mach 1035.gdl,seeds/Shockwave 320.gdl,seeds/Shockwave 525.gdl,seeds/Shockwave 1035.gdl,seeds/Turbulence 320.gdl,seeds/Turbulence 1035.gdl"

      - name: spec tests (layout, IDs, Extron design rules)
        run: python tests/test_spec.py

      - name: edit tests (selectors, rename, retarget, renumber, restyle)
        # These run against the real fixture rather than a synthetic project:
        # every bug this vocabulary has had came from the difference between
        # what a panel file looks like in the abstract and what one contains.
        run: python tests/test_edit.py

      - name: the worked edit spec still resolves against the fixture
        if: hashFiles('fixtures/gdl/*.gdl') != ''
        run: |
          python -m gdl.edit check examples/edits.json \
            fixtures/gdl/client-boardroom-2.0.0.gdl

      - name: the worked example still checks clean
        run: python -m gdl.spec check examples/panel.json

      - name: the worked example is still satisfiable by its donor
        # Catches both donor failures without a Windows box: a control type the
        # donor cannot supply (clone-never-construct), and a page or popup name
        # the built panel keeps from the donor - which is a hard build error, and
        # cost a round trip to the VM to discover.
        run: |
          python -m gdl.spec donors examples/panel.json "seeds/Afterburn 1035.gdl"

      - name: the worked example still emits a plan
        run: python -m gdl.spec plan examples/panel.json /tmp/plan.json

      - name: the prose-brief example still checks, resolves and plans
        # Small, and the one that found the missing font application and the
        # cp1252 spec read. Its en-dash caption is the encoding canary.
        run: |
          python -m gdl.spec check examples/huddle.json
          python -m gdl.spec donors examples/huddle.json "seeds/Afterburn 1035.gdl"
          python -m gdl.spec plan examples/huddle.json /tmp/huddle-plan.json
          python - <<'PY'
          import json
          plan = json.load(open('/tmp/huddle-plan.json', encoding='utf-8'))
          texts = [(op.get('fields') or {}).get('textField')
                   for op in plan['pages'][0]['controls']]
          assert '–' in texts, f'en-dash lost on the way to the plan: {texts}'
          sizes = {(op.get('font') or {}).get('size') for op in plan['pages'][0]['controls']}
          assert 40 in sizes and 26 in sizes, f'font sizes missing from the plan: {sizes}'
          print(f'  en-dash intact, {len(sizes)} distinct font sizes planned')
          PY

      - name: the plan still carries a size for every popup
        # Without it the applier leaves a cloned popup at the donor's size and
        # Build moves every control that overflows to 0,0, silently.
        run: |
          python - <<'PY'
          import json
          plan = json.load(open('/tmp/plan.json'))
          for p in plan['popups']:
              assert p.get('size'), f"popup {p['name']!r} has no size"
          print(f"  {len(plan['popups'])} popup(s), all sized")
          PY

      - name: every fixture and template still parses
        if: hashFiles('fixtures/gdl/*.gdl') != ''
        run: |
          python - <<'PY'
          import glob
          from gdl.project import Project
          files = sorted(glob.glob('fixtures/gdl/*.gdl'))
          assert files, 'no fixtures found'
          for f in files:
              p = Project.open(f)
              pages = list(p.pages())
              ctl = sum(len(x['controls']) for x in pages)
              assert pages and ctl, f'{f} parsed to nothing'
              print(f'  ok {len(pages):>3} pages {ctl:>5} controls  {f.split("/")[-1][:48]}')
          PY

      - name: theme extraction still agrees with the published Afterburn guide
        if: hashFiles('fixtures/gdl/*.gdl') != ''
        run: |
          python - <<'PY'
          from gdl.themes import extract, AFTERBURN
          t = extract('fixtures/gdl/client-boardroom-2.0.0.gdl')
          observed = {k.upper() for k, _ in t['fills'] + t['strokes']}
          doc = {v.upper() for v in AFTERBURN.values()
                 if isinstance(v, str) and v.startswith('#')}
          doc = {('#FF' + c[1:]) if len(c) == 7 else c for c in doc}
          # The client's own two, stored by .NET name and drawn so in GUI
          # Designer's snapshots: Gainsboro behind the keyboard popups' entry
          # field (6500/6600, 220,220,220) and DarkGray round the wireless-mic
          # page's outlines (3520, 169,169,169). They read as none until named
          # colors were read, which is all that kept this check passing.
          client = {'#FFDCDCDC', '#FFA9A9A9'}
          assert client <= observed, f'named colors read as none again: {sorted(client - observed)}'
          extra = observed - doc - client
          assert not extra, f'colors not in the Afterburn guide: {sorted(extra)}'
          print(f"  {len(observed)} colors observed, all in the guide or the client's own two")
          PY

      - name: the clean-room example checks on a canvas that is not 1280x800
        # TLP1020T, 1024x600 at 118 DPI. No donor: it needs a seed project a
        # human makes once, and the fixtures are client material. check and
        # render need neither.
        run: python -m gdl.spec check examples/clean-room.json

      - name: donor fitness gates (types, names, borders, fonts, canvas)
        # Each of these once cost a Windows round trip or, for fonts, shipped a
        # panel in the wrong typeface with a clean build.
        run: python tests/test_donor_gates.py

      - name: more than one page per spec
        # Every example and test used exactly one page until 2026-09-08, while
        # the client fixture has 27 - so cross-page id allocation was untested.
        run: python tests/test_multipage.py

      - name: containers with no built payload round-trip
        # .glt templates and unbuilt .gdl files hold only a ProjectGCP.
        # payload_name used to raise a bare StopIteration on them.
        run: python tests/test_container.py

      - name: buttons get Off/On feedback, and an inert one is caught
        # Every generated button was inert until 2026-09-10: the spec had no
        # vocabulary for a second appearance, and PBStates.Count reports 1 for a
        # two-state button, so both appliers wrote state 0 and stopped. Nothing
        # looked wrong - TLPDefaultStateID is 0, so the panel renders state 0
        # and only misbehaves once a control system switches it.
        run: python tests/test_states.py

      - name: a retarget scales every page's canvas, popups included
        # `retarget --scale` scaled the controls and emitted no page size, and
        # the applier set every page AND popup to the new screen size. Those
        # agree only when every popup is authored full-canvas, which is true of
        # the one project it was tested against and false in Extron's own
        # templates. The overflow check that was supposed to catch it skipped
        # popups - the only pages where a canvas may differ from the screen.
        run: python tests/test_retarget_canvas.py

      - name: every declared face comes back out of every fixture
        # The gate that was missing. Arial and Arial Black were declared,
        # embedded, and silently dropped by an over-strict size match for as
        # long as the extractor existed, and the inference drawn from that -
        # "they must be system faces" - reached this file, the README and the
        # render path.
        run: python tests/test_fonts.py

      - name: an icon font's glyphs are read by name
        # A spec's `icon` names a glyph the way the face names it. The rules run
        # on a face the test builds; Extron-Afterburn's own names come out of the
        # seed this job pulls.
        run: python tests/test_sfnt.py

      - name: the ID map - navigation checks and output
        # Every addressable control's ID, page, caption and function, and the
        # page flips checked. docs/idmap.md is the home.
        run: python tests/test_idmap.py

      - name: the ID map verifier fails on what Build can break
        run: python tests/test_verify_idmap.py

      - name: the functions example checks and writes its ID map
        run: |
          python -m gdl.idmap check examples/huddle-functions.json
          python -m gdl.idmap write examples/huddle-functions.json /tmp/idmap
          test -f /tmp/idmap/idmap.md && test -f /tmp/idmap/idmap.csv

      - name: palette entries and named colors read as their values
        # The palette class reads a seed from Git LFS and skips on a plain
        # checkout; the named-color class builds its project in memory and runs.
        run: python tests/test_palette.py

      - name: Extron's template table
        # The table is GUI Designer's own TemplateInfoTable.config, in neither
        # git nor the runner, so only the no-table case runs. It still imports
        # gdl.templates on every push.
        run: python tests/test_templates.py

      - name: a seed is checked for its model
        # Every case reads a seed from Git LFS: those on a seed both jobs
        # pull (the header lists them) run; those on another seed skip.
        run: python tests/test_verify_seed.py

      - name: the design systems read as the Design System page reads them
        # The page silently drops a token it cannot parse, so each profile's
        # tokens are checked against its grammar here. What needs a seed,
        # Extron's kit or its templates skips.
        run: python tests/test_designsys.py

      - name: what Shockwave's and Afterburn's profiles say of their templates
        # The truth ledgers' own checks for the two themes with them. What reads
        # a seed other than Afterburn's 1035, or Extron's kit, skips; the
        # kit-image comparison skips without Pillow.
        run: |
          python tests/test_shockwave_truth.py
          python tests/test_afterburn_truth.py

      - name: the Claude Design translator's rules, on the probe's output
        # No runtime here ($GDL_DC_RUNTIME unset), so the Chrome classes skip; the
        # `chrome` job runs them. What needs Extron's art skips too.
        run: python tests/test_design.py

      - name: the seed script's contract with its caller
        # Text pins: running powershell/New-GdlSeed.ps1 needs GUI Designer.
        run: python tests/test_seed_script.py

      - name: what a measured series is served by, and where its regions are
        # The regions rule runs on pages made in the test. What reads Extron's
        # templates or their table skips: neither is on the runner.
        run: python tests/test_measure_series.py

      - name: the panel scripts' contract with their caller
        # Text pins: running powershell/New-GdlPanel.ps1 needs GUI Designer.
        run: python tests/test_panel_scripts.py

      - name: where a run that drives GUI Designer asks what is in its way
        # Text pins. What powershell/GdlBlocker.ps1 sees is tested against a
        # stand-in window, which needs Windows, so those skip here.
        run: python tests/test_gd_blocker.py

      - name: the corpus audit's verdicts, on facts
        # The audit itself reads every seed and Extron's templates and takes
        # minutes, so its checks are pinned on the facts it keeps per project.
        run: python tests/test_audit_corpus.py

      - name: a test that needs the client files skips and says so
        run: python tests/test_corpus.py

      - name: the public copy's builder and its pre-push hook
        # Throwaway repositories; git and git-lfs are on the runner.
        run: python tests/test_public_sync.py

      - name: the skill Claude Code loads triggers as SKILL.md says
        run: python tests/test_skill.py

      - name: the format probes' inputs, runner and reader
        # Text and parse pins on examples/probes-128: running it needs GUI
        # Designer. What needs the seeds, pwsh or Chrome skips.
        run: python tests/test_probes_128.py

      - name: every Python file parses as the Windows host's 3.11 does
        # This job runs 3.12, which accepts f-strings 3.11 refuses (PEP 701);
        # one stopped the probe reader on the host.
        run: python tests/test_py311.py

      - name: every PowerShell script is ASCII or has a UTF-8 BOM
        # Windows PowerShell 5.1 reads a script with no BOM as the ANSI code page,
        # not UTF-8, so a non-ASCII character in one (a dash in a comment, the
        # multiplication sign in a regex class) reads as other characters there.
        # pwsh reads UTF-8 whatever the BOM, so the parse step below cannot see
        # this; the BOM makes 5.1 read the characters the file holds.
        run: |
          python - <<'PY'
          import glob
          bad = []
          for f in sorted(glob.glob('powershell/**/*.ps1', recursive=True) + glob.glob('examples/**/*.ps1', recursive=True)):
              b = open(f, 'rb').read()
              if not b.startswith(b'\xef\xbb\xbf') and any(c > 127 for c in b):
                  bad.append(f)
                  print(f'::error file={f}::non-ASCII bytes and no UTF-8 BOM: Windows PowerShell 5.1 reads it as ANSI')
          assert not bad, bad
          print('  every script is ASCII or has a BOM')
          PY

      - name: every PowerShell script parses
        # Nothing here runs them (they need GUI Designer), so a syntax error in
        # one would reach a Windows host first. pwsh is on the runner; its parser
        # is PowerShell 7's, a superset of 5.1's grammar for what these scripts
        # use, so it catches a syntax break but not a 5.1-only quirk, nor how 5.1
        # decodes the file (the step above covers that).
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Path powershell, examples -Recurse -Filter *.ps1) {
            $errs = $null; $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs) {
              $bad++
              foreach ($e in $errs) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
            } else { Write-Host "  ok $($f.Name)" }
          }
          if ($bad) { exit 1 }

      - name: every tests/test_*.py is run by a job in this file
        # A test file added and not named here would run nowhere, and nothing
        # else would fail.
        run: |
          missing=0
          for f in tests/test_*.py; do
            if ! grep -Eq "^[[:space:]]*(run: )?python $f[[:space:]]*$" .github/workflows/ci.yml; then
              echo "::error::$f is not run by any job in .github/workflows/ci.yml"
              missing=1
            fi
          done
          exit $missing

  fidelity:
    needs: lfs
    timeout-minutes: 30
    # The render harness, against GUI Designer's own snapshot exports. Runs here
    # only because every face is recoverable from the tracked fixtures; see the
    # note at the top of this file before assuming it can be simplified.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: the seeds' LFS objects, from the `lfs` job's cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-seeds-v2-${{ hashFiles('seeds/Afterburn*.gdl', 'seeds/Mach 320.gdl', 'seeds/Mach 525.gdl', 'seeds/Mach 725.gdl', 'seeds/Mach 1035.gdl', 'seeds/Shockwave 320.gdl', 'seeds/Shockwave 525.gdl', 'seeds/Shockwave 1035.gdl', 'seeds/Turbulence 320.gdl', 'seeds/Turbulence 1035.gdl') }}
          fail-on-cache-miss: true

      - name: check out the seeds the suite reads from them
        # The objects are local, so this fetches nothing from GitHub.
        run: git lfs pull --include "seeds/Afterburn*.gdl,seeds/Mach 320.gdl,seeds/Mach 525.gdl,seeds/Mach 725.gdl,seeds/Mach 1035.gdl,seeds/Shockwave 320.gdl,seeds/Shockwave 525.gdl,seeds/Shockwave 1035.gdl,seeds/Turbulence 320.gdl,seeds/Turbulence 1035.gdl"

      - name: install Pillow
        run: pip install -r requirements.txt

      - name: the type probe measures baked captions
        # Here rather than in `test`: tests/test_type_probe.py imports Pillow at
        # the top, so without it the file fails to import rather than skipping.
        run: python tests/test_type_probe.py

      - name: recover the embedded faces
        # All six fixtures where they are - no single one embeds every face, and
        # the baseline was scored on theirs - and the seed, which carries the same
        # Monotype Arial, only where they are not.
        run: |
          if ls fixtures/gdl/*.gdl >/dev/null 2>&1; then
            for f in fixtures/gdl/*.gdl; do python -m gdl.fonts "$f" gdl/fonts/; done
          else
            python -m gdl.fonts "seeds/Afterburn 1035.gdl" gdl/fonts/
          fi
          ls -1 gdl/fonts/

      - name: the layout verifier checks start page, modal popups and IDs
        # Here rather than in `test`: verify_built imports the compositor, so
        # these skip without Pillow. After the recovery: a formatted caption is
        # looked for in its art drawn in the fixture's own face.
        run: python tests/test_verify_built.py

      - name: a face drawn in a stand-in is said aloud
        # Here as well as in `test`, where its compositor tests skip without
        # Pillow. After the recovery, so the recovered Arial is there to draw in.
        run: python tests/test_fonts.py

      - name: the sign-off draws as the panel does, the scoring path as the snapshots do
        # Here rather than in `test`: it imports the compositor at the top. After
        # the recovery, so its carried-face tests have a recovered Arial to set
        # the panel's own face against.
        run: python tests/test_signoff_blend.py

      - name: an inert button is caught off its artwork
        # Here as well as in `test`, where the verifier's artwork tests skip
        # without Pillow: they are the only check that a button whose states
        # built alike fails.
        run: python tests/test_states.py

      - name: the preview draws a page's background image
        # Here as well as in `test`, where the preview tests skip without Pillow.
        # After the recovery: the preview draws its captions in the faces.
        run: python tests/test_spec.py

      - name: the render harness refuses another project's snapshots, and scores a preview against its build
        # After the recovery: it renders a page to score it. The preview's
        # build is archived in Git LFS, and skipped where it is a pointer.
        run: python tests/test_score.py

      - name: score the render against ground truth
        if: hashFiles('fixtures/gdl/*.gdl') != ''
        run: |
          python tests/score.py record \
            fixtures/gdl/client-boardroom-2.0.0.gdl \
            fixtures/snapshots/Individual -o /tmp/after.json

      - name: no page may regress against the shipped baseline
        if: hashFiles('fixtures/gdl/*.gdl') != ''
        run: python tests/score.py diff tests/baseline.json /tmp/after.json

  chrome:
    # The Claude Design translator's Chrome tests, in a job of their own so a slow
    # or hung Chrome holds up nothing else. Archive only: archive/dc-runtime/ is
    # excluded from the public copy (tools/public_sync.py), and without it every
    # class here skips.
    needs: lfs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Whether the runner lets Chrome make a user namespace for its sandbox is
      # unverified; if not, every render fails with "did not render". A throwaway
      # VM laying out our own test pages loses nothing by opting out; a desktop
      # run, which leaves this unset, keeps the sandbox.
      GDL_CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: the seeds' LFS objects, from the `lfs` job's cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-seeds-v2-${{ hashFiles('seeds/Afterburn*.gdl', 'seeds/Mach 320.gdl', 'seeds/Mach 525.gdl', 'seeds/Mach 725.gdl', 'seeds/Mach 1035.gdl', 'seeds/Shockwave 320.gdl', 'seeds/Shockwave 525.gdl', 'seeds/Shockwave 1035.gdl', 'seeds/Turbulence 320.gdl', 'seeds/Turbulence 1035.gdl') }}
          fail-on-cache-miss: true

      - name: check out the seeds the suite reads from them
        # The objects are local, so this fetches nothing from GitHub.
        run: git lfs pull --include "seeds/Afterburn*.gdl,seeds/Mach 320.gdl,seeds/Mach 525.gdl,seeds/Mach 725.gdl,seeds/Mach 1035.gdl,seeds/Shockwave 320.gdl,seeds/Shockwave 525.gdl,seeds/Shockwave 1035.gdl,seeds/Turbulence 320.gdl,seeds/Turbulence 1035.gdl"

      - name: install Pillow, pytest and its parallel runner
        run: pip install -r requirements.txt pytest pytest-xdist

      - name: the Design type's runtime the repository pins
        # Chosen by the SHA-256 gdl/dc_runtime.json lists, newest proven first,
        # not by directory order: a second runtime in archive/dc-runtime/ must not
        # become the one tested by sorting before the pinned one.
        if: hashFiles('archive/dc-runtime/*/dc-runtime.js') != ''
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import glob, hashlib, json, os, sys
          pinned = [p['sha256'] for p in reversed(json.load(open('gdl/dc_runtime.json'))['proven'])]
          have = {hashlib.sha256(open(f, 'rb').read()).hexdigest(): f
                  for f in glob.glob('archive/dc-runtime/*/dc-runtime.js')}
          for sha in pinned:
              if sha in have:
                  print('GDL_DC_RUNTIME=' + os.path.abspath(have[sha]))
                  break
          else:
              sys.exit('no archive/dc-runtime/*/dc-runtime.js matches a SHA-256 in gdl/dc_runtime.json')
          PY

      - name: the Claude Design translator, in Chrome
        # -n 4, as timed (see the header: 37 minutes). The file's non-Chrome tests run too;
        # what reads Extron's kit skips, as the header says.
        run: python -m pytest -q -n 4 tests/test_design.py
